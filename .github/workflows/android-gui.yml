name: Android GUI

# Builds the Proxmark5 Android app (client/android). The container used for
# development can't fetch the Android SDK, so the APK is built here, where the
# SDK and NDK are available. Artifact: an installable debug APK.
# The APK also bundles PM5 firmware built from this same tree, so the app can always
# flash a firmware that matches its client, even offline, and the help of every client
# command, from which the parameter editor builds its forms.

on:
  push:
    paths:
      - 'client/android/**'
      - 'client/src/**'
      - 'client/include/**'
      - 'client/deps/**'
      - 'client/resources/**'
      - 'client/dictionaries/**'
      - 'client/luascripts/**'
      - 'client/lualibs/**'
      - 'client/cmdscripts/**'
      - 'common/**'
      - 'include/**'
      - 'armsrc/**'
      - 'bootrom/**'
      - 'common_arm/**'
      - '.github/workflows/android-gui.yml'
  pull_request:
    paths:
      - 'client/android/**'
      - 'client/src/**'
      - 'client/include/**'
      - 'client/deps/**'
      - 'client/resources/**'
      - 'client/dictionaries/**'
      - 'client/luascripts/**'
      - 'client/lualibs/**'
      - 'client/cmdscripts/**'
      - 'common/**'
      - 'include/**'
      - 'armsrc/**'
      - 'bootrom/**'
      - 'common_arm/**'
      - '.github/workflows/android-gui.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  parsers:
    name: Parser unit tests (JVM)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Run parser tests
        working-directory: client/android
        run: ./gradlew -Pparsers.only :parsers:test --no-daemon --console=plain
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: parser-test-report
          path: client/android/parsers/build/reports/tests/

  apk:
    name: Build debug APK
    runs-on: ubuntu-latest
    env:
      NDK_VERSION: 27.1.12297006
      CMAKE_VERSION: 3.22.1
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          # don't install the obsolete legacy "tools" package (its removal makes the action fail)
          packages: ''

      - name: Install NDK and CMake
        run: |
          yes | sdkmanager "platforms;android-35" "build-tools;35.0.0" \
                           "ndk;${NDK_VERSION}" "cmake;${CMAKE_VERSION}"

      - name: Build the matching PM5 firmware
        run: |
          sudo apt-get update
          sudo apt-get install -yqq make gcc-arm-none-eabi libnewlib-dev jq
          make -j$((`nproc` + 1)) PLATFORM=PM5 bootrom fullimage recovery
          mkdir -p "$RUNNER_TEMP/pm5-firmware"
          cp bootrom/obj/bootrom.elf armsrc/obj/fullimage.elf recovery/recovery.bin "$RUNNER_TEMP/pm5-firmware/"
          # same fields the firmware release manifest carries (tools/mkversion.sh lines 14 and 16)
          jq -n --arg version "$(sed -n '14s/.*"\([^"]*\)".*/\1/p' armsrc/version_pm3.c)" \
                --arg armsrc "$(sed -n '16s/.*"\([^"]*\)".*/\1/p' armsrc/version_pm3.c)" \
                --arg commit "$GITHUB_SHA" \
                '{variant: "pm5", platform: "PM5", version: $version, armsrc: $armsrc, commit: $commit}' \
                > "$RUNNER_TEMP/pm5-firmware/firmware.json"
          cat "$RUNNER_TEMP/pm5-firmware/firmware.json"

      # The parameter editor builds its forms from the help of every command: dump it from a host
      # build of the client of this same tree (no device needed) and ship it as assets/pm3-help
      - name: Dump the help of the client's commands
        run: |
          sudo apt-get install -yqq pkg-config libreadline-dev libbz2-dev liblz4-dev
          make -j$((`nproc` + 1)) client SKIPQT=1 SKIPBT=1 SKIPPYTHON=1 SKIPGD=1
          mkdir -p "$RUNNER_TEMP/pm3-home"
          HOME="$RUNNER_TEMP/pm3-home" client/proxmark3 --fulltext > "$RUNNER_TEMP/pm3-help.txt"
          n=$(grep -c '^-\{40,\}$' "$RUNNER_TEMP/pm3-help.txt" || true)
          echo "commands in the dump: $n"
          [ "$n" -gt 900 ] || { echo "::error::the help dump has only $n commands"; exit 1; }

      # every example the help gives must read into known parameters and build back the same line
      - name: Check the editor reads the whole help
        working-directory: client/android
        env:
          PM3_HELP_DUMP: ${{ runner.temp }}/pm3-help.txt
        run: ./gradlew -Pparsers.only :parsers:test --tests '*FullDumpTest*' --no-daemon --console=plain

      - name: Build APK
        working-directory: client/android
        run: ./gradlew :app:assembleDebug --no-daemon --console=plain -Ppm3.ndkVersion=${NDK_VERSION} -Ppm3.firmwareDir=$RUNNER_TEMP/pm5-firmware -Ppm3.helpDump=$RUNNER_TEMP/pm3-help.txt

      - name: Collect APK
        run: |
          mkdir -p out
          cp client/android/app/build/outputs/apk/debug/*.apk out/proxmark5-debug.apk

      # Gradle skips a Sync task whose source directory is not there, with no error, and a client
      # without its tables and key lists runs all the same: look inside the APK
      - name: Check the APK carries the client resources
        run: |
          unzip -l out/proxmark5-debug.apk > "$RUNNER_TEMP/apk-files.txt"
          for f in assets/pm3/resources/hardnested_tables/ assets/pm3/dictionaries/mfc_default_keys.dic assets/pm3-help/fulltext.txt; do
            grep -qF "$f" "$RUNNER_TEMP/apk-files.txt" || { echo "::error::the APK has no $f"; exit 1; }
          done

      - uses: actions/upload-artifact@v6
        with:
          name: proxmark5-android-debug
          path: out/proxmark5-debug.apk
          if-no-files-found: error
